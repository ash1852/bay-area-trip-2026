name: Check and deploy itinerary
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - uses: actions/configure-pages@v5
      - name: Collect public site files
        run: |
          mkdir -p _site
          cp index.html app.js styles.css _site/
          cp -r data vendor _site/
      - name: Version updated browser assets
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const v=process.env.GITHUB_SHA;
          const html=readFileSync('_site/index.html','utf8').replace('href="styles.css"',`href="styles.css?v=${v}"`).replace('src="app.js"',`src="app.js?v=${v}"`);
          const app=readFileSync('_site/app.js','utf8').replaceAll("./data/itinerary.js",`./data/itinerary.js?v=${v}`).replaceAll("./data/route-model.js",`./data/route-model.js?v=${v}`).replaceAll("./data/route-paths.js",`./data/route-paths.js?v=${v}`).replaceAll("./data/route-geometry.js",`./data/route-geometry.js?v=${v}`);
          writeFileSync('_site/index.html',html);writeFileSync('_site/app.js',app);
          JS
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
