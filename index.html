<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#173e3a">
  <meta name="description" content="10 月旧金山与 Oakland 行程地图：按天查看路线、时间安排、用餐、预算与预约事项。">
  <title>湾区慢行 · 行程地图</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23173e3a'/%3E%3Cpath d='M8 28V13l8 4 8-5 8 4v15l-8-4-8 5z' fill='none' stroke='%23f6eddb' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="styles.css">
  <script src="vendor/leaflet.js" defer></script><script src="app.js" type="module"></script>
</head>
<body>
  <a href="#schedule" class="skip">跳到行程安排</a>
  <header class="topbar">
    <div class="brand"><span class="brand-icon" aria-hidden="true">↗</span><div><h1>湾区慢行<span> BAY AREA</span></h1><p>2026.10.02 — 10.10 · 旧金山 / Oakland</p></div></div>
    <button id="guide-open" class="quiet">预约与出行准备 <span aria-hidden="true">↗</span></button>
  </header>
  <nav id="days" class="days" aria-label="选择行程日期"></nav>
  <main class="workspace">
    <section class="map-panel" aria-label="当天行程地图">
      <div id="map" role="region" aria-label="可缩放行程地图"></div>
      <div class="map-toolbar">
        <div class="mode-switch" role="group" aria-label="地图显示模式">
          <button data-mode="route" aria-pressed="true">路线模式</button><button data-mode="time" aria-pressed="false">时间模式</button>
        </div>
        <button id="fit" class="fit">查看全日</button>
      </div>
      <div id="map-message" class="map-message" role="status" hidden></div>
      <div class="map-bottom">
        <div class="legend"><span style="--key:#207568">● 景点 / 地点</span><span style="--key:#a86109">◆ 活动</span><span style="--key:#315eb3">↗ 中转</span><span style="--key:#8651ad">▰ 具体交通</span></div>
        <p class="map-caption">点击节点看详情，点击 + 展开子节点。虚线为路线示意；细线连接避让标签与实际位置。</p>
        <div id="time-rail" class="time-rail" aria-label="点击时间定位地图" hidden></div>
      </div>
    </section>
    <aside id="schedule" class="schedule" tabindex="-1">
      <div class="day-heading"><p id="day-kicker" class="eyebrow"></p><h2 id="day-title"></h2><p id="day-subtitle"></p><button id="budget" class="budget"></button></div>
      <div class="selection" id="selection" aria-live="polite"></div>
      <div class="list-heading"><h3 id="list-title">今天的路线</h3><span id="event-count"></span></div>
      <div id="events" class="events"></div>
      <div class="day-notes"><h3>留一点余量</h3><ul id="day-notes"></ul></div>
    </aside>
  </main>
  <dialog id="guide"><div class="dialog-top"><h2 id="dialog-title">预约与出行准备</h2><button id="guide-close" aria-label="关闭">×</button></div><div id="guide-content"></div></dialog>
  <noscript><p class="noscript">请启用 JavaScript，以查看可交互地图与时间安排。</p></noscript>
</body>
</html>
